name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff pytest
      - name: Install NLTK data
        run: python -m nltk.downloader stopwords wordnet
      - name: Lint
        run: ruff check --select E4,E7,E9,F tests flask_app/app.py
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q flask_app src tests
      - name: Build Docker image
        run: docker build --tag sentiment-analysis:ci .
